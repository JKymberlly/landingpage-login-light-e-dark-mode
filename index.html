<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <img src="/img/logo.png" alt="" class="logo">
            <ul class="navigation">
                <li><a href="">Inicio</a></li>
                <li><a href="">Sobre</a></li>
                <li><a href="">Contatos</a></li>
            </ul>
            <button id="tema">Tema</button>
        </nav>
    </header>
    
    <section class="CoffeBackground">
        <form action="">
            <ul class="ul-form">
                <h1>Area do Cliente</h1>
                <img src="/img/tea-cup.png" alt="" class="img-cafe">
                <li>
                    <label for="text"><img src="/img/user.png" alt="" class="img-form"></label>
                    <input type="text" placeholder="Usuario:">
                </li>
                <li>
                    <label for=""><img src="/img/email.png" alt="" class="img-form"></label>
                    <input type="email" placeholder="Email:">
                </li>
                <li>
                    <label for="numeber"><img src="/img/telephone.png" alt="" class="img-form"></label>
                    <input type="number" placeholder="Telefone:">
                </li>
                <li>
                    <label for="password"><img src="/img/password.png" alt="" class="img-form"></label>
                    <input type="password" placeholder="Senha:">
                </li>
                <button class="login">Fazer Login</button>
            </ul>
        </form>
    </section>

    <footer>
        <div class="rodape">
            <div>
                <p>Relatar erro</p>
                <p>Trabalhe Conosco</p>
            </div>
            <div>
                <p>(19) 99999-9999</p>
                <p>Rua Oliveira da Pátria, 1509</p>
            </div>
        </div>
    </footer>
</body>
</html>
